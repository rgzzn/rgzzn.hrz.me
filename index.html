<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luca Ragazzini Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "media",
        theme: {
          extend: {
            colors: {
              primary: "#a855f7",
              black: "#0a0a0a",
              "black-soft": "#1a1a1a",
            },
            fontFamily: {
              sans: ["Space Grotesk", "sans-serif"],
              serif: ["Playfair Display", "serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
            cursor: {
              crosshair: "crosshair",
            },
            animation: {
              "spin-slow": "spin 15s linear infinite",
              "spin-reverse-slow": "spin-reverse 15s linear infinite",
              "enter-up":
                "enter-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards",
              "draw-w": "draw-w 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards",
              "draw-h": "draw-h 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards",
              "pulse-slow": "pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite",
              float: "float 8s ease-in-out infinite",
              "float-delayed": "float 8s ease-in-out 4s infinite",
              scan: "scan 4s linear infinite",
              "grow-h": "grow-h 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards",
              "pulse-soft": "pulse-soft 2s infinite",
              "ring-pulse": "ring-pulse 2s ease-in-out infinite",
              "aurora-drift": "aurora-drift 16s ease-in-out infinite",
              "mobile-float": "mobile-float 3.2s ease-in-out infinite",
              "mobile-glow": "mobile-glow 2.8s ease-in-out infinite",
              "mobile-card": "mobile-card 4.5s ease-in-out infinite",
              "mobile-bob": "mobile-bob 3.6s ease-in-out infinite",
              "mobile-sheen": "mobile-sheen 3.2s linear infinite",
              "card-shimmer": "card-shimmer 5s ease-in-out infinite",
              "wiggle-soft": "wiggle-soft 3s ease-in-out infinite",
              "desktop-hover-glide":
                "desktop-hover-glide 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) both",
              "desktop-reveal-stagger":
                "desktop-reveal-stagger 0.8s cubic-bezier(0.16, 1, 0.3, 1) both",
              "desktop-focus-expand":
                "desktop-focus-expand 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) both",
              "mobile-tap-scale": "mobile-tap-scale 0.15s ease-out forwards",
              "mobile-slide-up":
                "mobile-slide-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) both",
              "mobile-horizontal-scroll-hint":
                "mobile-horizontal-scroll-hint 2s ease-in-out infinite",
            },
            keyframes: {
              "desktop-hover-glide": {
                "0%": { transform: "translateY(0)" },
                "100%": { transform: "translateY(-8px)" },
              },
              "desktop-reveal-stagger": {
                "0%": { opacity: "0", transform: "translateY(20px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
              "desktop-focus-expand": {
                "0%": { transform: "scale(1)" },
                "100%": { transform: "scale(1.05)" },
              },
              "mobile-tap-scale": {
                "0%": { transform: "scale(1)" },
                "100%": { transform: "scale(0.96)" },
              },
              "mobile-slide-up": {
                "0%": { opacity: "0", transform: "translateY(30px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
              "mobile-horizontal-scroll-hint": {
                "0%, 100%": { transform: "translateX(0)" },
                "50%": { transform: "translateX(10px)" },
              },
              "wiggle-soft": {
                "0%, 100%": { transform: "rotate(0deg)" },
                "25%": { transform: "rotate(-4deg)" },
                "75%": { transform: "rotate(4deg)" },
              },
              "card-shimmer": {
                "0%, 100%": { backgroundPosition: "0% 50%" },
                "50%": { backgroundPosition: "100% 50%" },
              },
              "mobile-float": {
                "0%, 100%": { transform: "translateY(0) scale(1)" },
                "50%": { transform: "translateY(-6px) scale(1.05)" },
              },
              "mobile-glow": {
                "0%, 100%": {
                  opacity: "0.55",
                  boxShadow: "0 0 0 0 rgba(168,85,247,0.25)",
                },
                "50%": {
                  opacity: "1",
                  boxShadow: "0 0 0 6px rgba(168,85,247,0)",
                },
              },
              "mobile-card": {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-4px)" },
              },
              "mobile-bob": {
                "0%, 100%": { transform: "translateX(0)" },
                "50%": { transform: "translateX(3px)" },
              },
              "mobile-sheen": {
                "0%": { backgroundPosition: "100% 0" },
                "100%": { backgroundPosition: "-120% 0" },
              },
              "aurora-drift": {
                "0%": {
                  transform: "translate3d(-8%, -2%, 0) scale(1)",
                  opacity: "0.26",
                },
                "40%": {
                  transform: "translate3d(6%, 4%, 0) scale(1.08)",
                  opacity: "0.38",
                },
                "70%": {
                  transform: "translate3d(-2%, 7%, 0) scale(0.96)",
                  opacity: "0.28",
                },
                "100%": {
                  transform: "translate3d(-8%, -2%, 0) scale(1)",
                  opacity: "0.26",
                },
              },
              "ring-pulse": {
                "0%, 100%": {
                  boxShadow: "0 0 0 2px rgba(168, 85, 247, 0.6)",
                },
                "50%": {
                  boxShadow: "0 0 0 6px rgba(168, 85, 247, 0.2)",
                },
              },
              "pulse-soft": {
                "0%, 100%": {
                  transform: "scale(1)",
                  boxShadow: "0 0 0 0 rgba(168, 85, 247, 0.4)",
                },
                "50%": {
                  transform: "scale(1.2)",
                  boxShadow: "0 0 0 10px rgba(168, 85, 247, 0)",
                },
              },
              "spin-reverse": {
                "0%": { transform: "rotate(0deg)" },
                "100%": { transform: "rotate(-360deg)" },
              },
              "enter-up": {
                "0%": { opacity: "0", transform: "translateY(20px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
              "draw-w": {
                "0%": { width: "0%" },
                "100%": { width: "100%" },
              },
              "draw-h": {
                "0%": { height: "0%" },
                "100%": { height: "100%" },
              },
              "grow-h": {
                "0%": { height: "0%", opacity: "0" },
                "100%": { height: "100%", opacity: "1" },
              },
              float: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-15px)" },
              },
              scan: {
                "0%": { top: "-10%", opacity: "0" },
                "10%": { opacity: "1" },
                "90%": { opacity: "1" },
                "100%": { top: "110%", opacity: "0" },
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        cursor: crosshair;
        background-color: #ffffff;
        color: #0a0a0a;
      }

      :root {
        color-scheme: light dark;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0a0a0a;
          color: #f5f5f5;
        }
      }

      html {
        scrollbar-width: thin;
        scrollbar-color: rgba(10, 10, 10, 0.24) transparent;
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background-color: rgba(10, 10, 10, 0.24);
        border: 2px solid transparent;
        border-radius: 999px;
        background-clip: padding-box;
      }

      @media (prefers-color-scheme: dark) {
        html {
          scrollbar-color: rgba(245, 245, 245, 0.28) transparent;
        }

        ::-webkit-scrollbar-thumb {
          background-color: rgba(245, 245, 245, 0.28);
        }
      }

      .writing-vertical-rl {
        writing-mode: vertical-rl;
        text-orientation: mixed;
      }

      /* Noise Effect */
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 50;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .delay-100 {
        animation-delay: 100ms;
      }

      .delay-200 {
        animation-delay: 200ms;
      }

      .delay-300 {
        animation-delay: 300ms;
      }

      .delay-500 {
        animation-delay: 500ms;
      }

      .delay-700 {
        animation-delay: 700ms;
      }

      .delay-1000 {
        animation-delay: 1000ms;
      }

      :focus-visible {
        outline: 2px solid #a855f7;
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react/": "https://esm.sh/react@^19.2.4/",
          "react": "https://esm.sh/react@^19.2.4",
          "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
          "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
        }
      }
    </script>
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="stylesheet" href="/index.css" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
